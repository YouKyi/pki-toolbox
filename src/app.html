<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<!-- Chrome du navigateur accordé au fond de page de la charte (v2). -->
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f7f4" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131211" />
		<meta
			name="description"
			content="Self-hosted, 100% client-side decoder for X.509 certificates, CSRs and certificate chains."
		/>
		<!-- No-FOUC theme application, before first paint: an explicit choice wins,
		     otherwise the operating system decides. This mirrors the resolution in
		     src/lib/theme.svelte.ts and has to run here, before anything paints,
		     or a dark-OS reader gets a full-viewport white flash on first load.
		     Kept in the head on purpose: SvelteKit hash-mode CSP allows head inline
		     scripts, whereas a script placed after the body placeholder is blocked.

		     There is deliberately NO loading screen. The site is a prerendered
		     static build with self-hosted fonts and no network calls, so it paints
		     almost immediately; a splash would spend that budget on itself, hide
		     the page from screen readers, and make the fastest decoder feel slow. -->
		<script>
			try {
				var mode = localStorage.getItem('pki-toolbox-theme');
				if (mode !== 'light' && mode !== 'dark') mode = 'auto';
				var dark =
					mode === 'dark' ||
					(mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				if (dark) document.documentElement.classList.add('dark');
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
