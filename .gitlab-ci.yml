stages:
  - lint
  - test
  - e2e
  - docker
  - release

variables:
  IMAGE: $CI_REGISTRY_IMAGE
  TAG_SHA: $CI_COMMIT_SHORT_SHA
  TRIVY_VERSION: '0.76.2'
  # Canonical public source repository, stamped into the image OCI labels.
  SOURCE_URL: https://github.com/youkyi/pki-toolbox

# Paths that, when changed, require rebuilding the image. A push that only
# touches docs or config (README, CHANGELOG, renovate.json, ...) does not
# match, so it runs lint/test only and skips the docker job.
.build-paths: &build-paths
  - 'src/**/*'
  - 'static/**/*'
  - 'package.json'
  - 'pnpm-lock.yaml'
  - 'vite.config.ts'
  - 'tsconfig.json'
  - 'Dockerfile'
  - 'nginx.conf'
  - 'nginx-main.conf'
  - '.dockerignore'
  - '.gitlab-ci.yml'

# Rules communes aux trois jobs de la chaine image (build, scan, promotion).
.image-rules: &image-rules
  - if: $CI_COMMIT_TAG
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes: *build-paths
  - if: $CI_COMMIT_BRANCH
    changes: *build-paths

# Composants du CI/CD Catalog. Ce depot est la source d'origine de docker-build,
# trivy-scan et gitlab-release : les jobs qui vivaient ici ont ete extraits vers le
# catalog, corriges, puis republies en v2.0.0.
#
# Corrections apportees par les composants, par rapport aux jobs locaux :
#   - trivy-scan : le scanner de licences sortait du gate en cassant le pipeline sur
#     toute dependance GPL ou LGPL. Il est desormais dans une passe separee, non
#     bloquante, activee ici car ce projet est publie sous MIT et distribue ;
#   - docker-build : le scan sortait VERT sur une image dont l'OS de base est en fin
#     de vie, ignore_unfixed masquant les paquets en statut end_of_life. exit_on_eol
#     ferme ce trou ;
#   - docker-build : le volume trivy-cache ne cachait rien, cree sur le daemon dind
#     et detruit avec lui ;
#   - gitlab-release : une section de changelog absente publiait une release aux
#     notes VIDES, definitivement et sans signal.
include:
  - component: $CI_SERVER_FQDN/youkyi-hq/platform/ci/ci-catalog/gitleaks-scan@v5.1.4
    inputs:
      stage: lint
  - component: $CI_SERVER_FQDN/youkyi-hq/platform/ci/ci-catalog/ggshield-scan@v5.1.4
    inputs:
      stage: lint
  - component: $CI_SERVER_FQDN/youkyi-hq/platform/ci/ci-catalog/trivy-vuln@v5.1.4
    inputs:
      stage: lint
  - component: $CI_SERVER_FQDN/youkyi-hq/platform/ci/ci-catalog/trivy-secret@v5.1.4
    inputs:
      stage: lint
  - component: $CI_SERVER_FQDN/youkyi-hq/platform/ci/ci-catalog/trivy-license@v5.1.4
    inputs:
      stage: lint
      # Ce projet est publie sous MIT et distribue publiquement (GitHub, GHCR,
      # Docker Hub) : le controle de licences y a un objet juridique reel, ce qui
      # n'est pas le cas d'un depot prive non distribue.
  # Chaine image v3 : build d'un candidat, scan Trivy par digest, puis promotion de
  # ce seul digest. Rien de non scanne ne recoit :<sha>, latest ni la version.
  # Les gates attendus par la v2 avant le build attendent desormais la promotion.
  - component: $CI_SERVER_FQDN/youkyi-hq/platform/ci/ci-catalog/container-image@v5.1.4
    inputs:
      stage: docker
      rules: *image-rules
      source_url: https://github.com/youkyi/pki-toolbox
      # Republication vers les registres publics, sur tag git uniquement, donc
      # toujours une reference immuable. Chaque miroir reste inerte tant que sa
      # variable de token est vide : ce sont les NOMS qui sont passes ici. La
      # promotion tourne dans l'environnement image-promote (defaut de
      # promote_environment, action prepare) : GHCR_* et DOCKERHUB_*, protegees et
      # portees sur lui, n'atteignent ni lint, ni test, ni e2e.
      mirrors: 'ghcr.io|ghcr.io/youkyi/pki-toolbox|GHCR_USER|GHCR_TOKEN docker.io|docker.io/youkyi/pki-toolbox|DOCKERHUB_USER|DOCKERHUB_TOKEN'
      promote_needs:
        # Sur un tag, rien ne part vers le registre ni les miroirs avant la signature
        # verifiee. optional : la provenance n'existe que sur les pipelines de tag,
        # ou elle est toujours creee.
        - { job: 'catalog:release-provenance', artifacts: false, optional: true }
        - { job: lint, artifacts: false }
        - { job: test, artifacts: false }
        # Needs dur : les rules d'e2e (MR, branche, tag) couvrent celles de l'image.
        - { job: e2e, artifacts: false }
        - { job: 'catalog:gitleaks-scan', artifacts: false }
        - { job: 'catalog:ggshield-scan', artifacts: false }
        - { job: 'catalog:trivy-vuln', artifacts: false }
        - { job: 'catalog:trivy-secret', artifacts: false }
        - { job: 'catalog:trivy-license', artifacts: false }
  # Release v5 (decision 24 du catalog) : a chaque push sur main, la CI tient a jour
  # la branche release/next et sa MR chore(release): X.Y.Z, jamais en auto-merge. Un
  # humain la merge ; le pipeline suivant de main pose le tag, signe SSH par la cle
  # du bot, apres les memes gates que la promotion. Dans le pipeline du tag, la
  # provenance verifie la signature avant la promotion et la release. Ne rien pousser
  # sur release/next : les notes s'ecrivent dans [Unreleased] du CHANGELOG, par MR.
  # Prerequis : RELEASE_TOKEN et RELEASE_SIGNING_KEY portees sur l'environnement
  # release, la cle publique du bot dans allowed_signers ; projet en merge commit,
  # pipeline vert exige, pipeline ignore refuse. Tag signe a la main, chaque
  # mainteneur selon ses outils : OpenPGP (YubiKey) contre release-signers.asc, SSH
  # contre allowed_signers, a cote de la cle du bot.
  - component: $CI_SERVER_FQDN/youkyi-hq/platform/ci/ci-catalog/auto-release@v5.1.4
    inputs:
      version_files: package.json
      gpg_public_keys: release-signers.asc
      tag_needs:
        - { job: lint, artifacts: false }
        - { job: test, artifacts: false }
        - { job: e2e, artifacts: false }
        - { job: 'catalog:gitleaks-scan', artifacts: false }
        - { job: 'catalog:ggshield-scan', artifacts: false }
        - { job: 'catalog:trivy-vuln', artifacts: false }
        - { job: 'catalog:trivy-secret', artifacts: false }
        - { job: 'catalog:trivy-license', artifacts: false }
  - component: $CI_SERVER_FQDN/youkyi-hq/platform/ci/ci-catalog/gitlab-release@v5.1.4
    inputs:
      stage: release
      release_name: 'pki-toolbox $CI_COMMIT_TAG'
      # RELEASE_PROVENANCE (dotenv de catalog:release-provenance) dit comment le tag
      # est signe et comment le verifier.
      extra_notes: 'Container image: $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG ($IMAGE_DIGEST). $RELEASE_PROVENANCE'

# Surcharge du composant gitlab-release : il pose dependencies: [], sans lequel
# IMAGE_DIGEST (dotenv de la promotion) et RELEASE_PROVENANCE (dotenv de la
# provenance) arriveraient vides dans les notes. Pas de release sur un tag dont la
# signature n'est pas verifiee.
'catalog:gitlab-release':
  needs: ['catalog:image-promote', 'catalog:release-provenance']
  dependencies: ['catalog:image-promote', 'catalog:release-provenance']

# Run exactly one pipeline per change: a merge-request pipeline when an MR is
# open, otherwise a branch pipeline, plus tag pipelines. The default branch keeps
# its pipeline even when an MR starts from it, otherwise nothing gets promoted.
workflow:
  rules:
    # Le commit de release (API Commits) arrive sur release/* avant sa MR : le
    # pipeline de MR suffit, pas de pipeline de branche ni d'image candidate en plus.
    - if: $CI_COMMIT_BRANCH =~ /^release\// && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_BRANCH

# Node jobs share the same image, a pnpm-store cache and the install step.
default:
  image: node:26-alpine@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    # Exact pnpm of `packageManager`, via npm: corepack is gone from Node 25 on.
    - npm install -g --no-fund --no-audit "$(node -p "require('./package.json').packageManager")"
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

# lint and test run on every pipeline: they are fast and guard every change.
lint:
  stage: lint
  needs: []
  script:
    - pnpm lint
    - pnpm check

test:
  stage: test
  needs: []
  script:
    - pnpm test

# End-to-end tests: build the static app and run Playwright against the exact
# prerendered output (playwright.config.ts webServer = `pnpm build && pnpm
# preview`). Uses the official Playwright image (browsers + system deps baked
# in), pinned to the same version as the @playwright/test devDependency. A noble
# base (Node >= 22.13) is required so the pnpm of the default
# before_script works: the Node-20 -jammy image fails the pnpm engine check.
e2e:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
  needs: []
  script:
    - pnpm exec playwright test
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
      - junit.xml
    reports:
      junit: junit.xml
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    # Tag pipelines set CI_COMMIT_TAG and no CI_COMMIT_BRANCH: without this rule
    # the released artefact would never be exercised end-to-end.
    - if: $CI_COMMIT_TAG

