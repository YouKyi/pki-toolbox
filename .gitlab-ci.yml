stages:
  - lint
  - test
  - e2e
  - scan
  - docker
  - release

variables:
  IMAGE: $CI_REGISTRY_IMAGE
  TAG_SHA: $CI_COMMIT_SHORT_SHA
  TRIVY_VERSION: '0.74.0'
  # Public mirrors for the open-source release images. The push steps in the
  # `docker` job are no-ops until the matching *_TOKEN/_USER CI/CD variables are
  # set in GitLab, so these defaults stay inert until publishing is turned on.
  GHCR_IMAGE: ghcr.io/youkyi/pki-toolbox
  DOCKERHUB_IMAGE: docker.io/youkyi/pki-toolbox
  # Canonical public source repository, stamped into the image OCI labels.
  SOURCE_URL: https://github.com/youkyi/pki-toolbox

# Paths that, when changed, require rebuilding the image. A push that only
# touches docs or config (README, CHANGELOG, renovate.json, ...) does not
# match, so it runs lint/test only and skips the docker job.
.build-paths: &build-paths
  - 'src/**/*'
  - 'static/**/*'
  - 'package.json'
  - 'pnpm-lock.yaml'
  - 'svelte.config.js'
  - 'vite.config.ts'
  - 'tsconfig.json'
  - 'Dockerfile'
  - 'nginx.conf'
  - 'nginx-main.conf'
  - '.dockerignore'
  - '.gitlab-ci.yml'

# Composants du CI/CD Catalog. Ce depot est la source d'origine de docker-build,
# trivy-scan et gitlab-release : les jobs qui vivaient ici ont ete extraits vers le
# catalog, corriges, puis republies en v2.0.0.
#
# Corrections apportees par les composants, par rapport aux jobs locaux :
#   - trivy-scan : le scanner de licences sortait du gate en cassant le pipeline sur
#     toute dependance GPL ou LGPL. Il est desormais dans une passe separee, non
#     bloquante, activee ici car ce projet est publie sous MIT et distribue ;
#   - docker-build : le scan sortait VERT sur une image dont l'OS de base est en fin
#     de vie, ignore_unfixed masquant les paquets en statut end_of_life. exit_on_eol
#     ferme ce trou ;
#   - docker-build : le volume trivy-cache ne cachait rien, cree sur le daemon dind
#     et detruit avec lui ;
#   - gitlab-release : une section de changelog absente publiait une release aux
#     notes VIDES, definitivement et sans signal.
include:
  - component: $CI_SERVER_FQDN/YouKyi-Infra/ci-infrastructure/ci-catalog/trivy-scan@v2.0.5
    inputs:
      stage: scan
      # Ce projet est publie sous MIT et distribue publiquement (GitHub, GHCR,
      # Docker Hub) : le controle de licences y a un objet juridique reel, ce qui
      # n'est pas le cas d'un depot prive non distribue.
      license_scan: true
  - component: $CI_SERVER_FQDN/YouKyi-Infra/ci-infrastructure/ci-catalog/docker-build@v2.0.5
    inputs:
      stage: docker
      source_url: https://github.com/youkyi/pki-toolbox
      # Republication vers les registres publics, sur tag git uniquement, donc
      # toujours une reference immuable. Chaque miroir reste inerte tant que sa
      # variable de token est vide : ce sont les NOMS qui sont passes ici.
      mirrors: 'ghcr.io|ghcr.io/youkyi/pki-toolbox|GHCR_USER|GHCR_TOKEN docker.io|docker.io/youkyi/pki-toolbox|DOCKERHUB_USER|DOCKERHUB_TOKEN'
  - component: $CI_SERVER_FQDN/YouKyi-Infra/ci-infrastructure/ci-catalog/gitlab-release@v2.0.5
    inputs:
      stage: release
      release_name: 'pki-toolbox $CI_COMMIT_TAG'
      extra_notes: 'Container image: $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG'

# Surcharges des composants. Les jobs sont redeclares par leur job_name ; rules,
# needs et changes etant des tableaux, ces valeurs remplacent celles du composant.
'catalog:trivy-scan':
  needs: []

'catalog:docker-build':
  needs:
    - lint
    - test
    - 'catalog:trivy-scan'
    - job: e2e
      optional: true
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *build-paths
    - if: $CI_COMMIT_BRANCH
      changes: *build-paths

'catalog:gitlab-release':
  needs: ['catalog:docker-build']

# Run exactly one pipeline per change: a merge-request pipeline when an MR is
# open, otherwise a branch pipeline, plus tag pipelines.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# Node jobs share the same image, a pnpm-store cache and the install step.
default:
  image: node:24-alpine@sha256:e67514e5d0f6c46656005e1b693b2ec9d52e80b641307de684d4a015ba7a4eaf
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

# lint and test run on every pipeline: they are fast and guard every change.
lint:
  stage: lint
  needs: []
  script:
    - pnpm lint
    - pnpm check

test:
  stage: test
  needs: []
  script:
    - pnpm test

# End-to-end tests: build the static app and run Playwright against the exact
# prerendered output (playwright.config.ts webServer = `pnpm build && pnpm
# preview`). Uses the official Playwright image (browsers + system deps baked
# in), pinned to the same version as the @playwright/test devDependency. A noble
# base (Node >= 22.13) is required so corepack/pnpm@11 in the default
# before_script works: the Node-20 -jammy image fails the pnpm engine check.
e2e:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
  needs: []
  script:
    - pnpm exec playwright test
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
      - junit.xml
    reports:
      junit: junit.xml
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    # Tag pipelines set CI_COMMIT_TAG and no CI_COMMIT_BRANCH: without this rule
    # the released artefact would never be exercised end-to-end.
    - if: $CI_COMMIT_TAG

